name: opencode-authelia

services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./config:/config
      - ./data:/data
    environment:
      - TZ=Etc/UTC
      # The image runs as this uid and chowns /config to it on every start.
      # Keep them equal to the host user in .env, otherwise the directory ends
      # up owned by root and the host can no longer edit configuration.yml.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    expose:
      - "9091"
    networks:
      - gateway

networks:
  gateway:
    external: true
