name: opencode-authelia

services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./config:/config
      - ./data:/data
    environment:
      - TZ=Etc/UTC
    expose:
      - "9091"
    networks:
      - gateway

networks:
  gateway:
    external: true
