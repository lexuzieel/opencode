server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Keep the private tree out of search engines even when robots.txt is
    # ignored. A location with its own add_header drops this one, which is
    # how /public/ below gets indexable without a second server block.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Read-only file dump: browse directories, download files, never upload.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Public links live under an unguessable uuid folder: no listing there.
    # They are handed to people and to automated readers, so unlike the
    # private tree they may be indexed and archived.
    location /public/ {
        autoindex off;
        add_header X-Robots-Tag "index, follow" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Never let nginx list dotfiles or backups.
    location ~ /\. { deny all; }
}
