server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Keep public links out of search engines even when robots.txt is ignored.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Read-only file dump: browse directories, download files, never upload.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never let nginx list dotfiles or backups.
    location ~ /\. { deny all; }
}
