server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Keep the private tree out of search engines even when robots.txt is
    # ignored. A location with its own add_header drops this one, which is
    # how /public/ below gets indexable without a second server block.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Read-only file dump: browse directories, download files, never upload.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Reports and listings are text; the PDFs are already compressed.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Files in the dump never change once written, but a name can be reused by
    # a regenerated report. Without Cache-Control the browser guesses (10% of
    # the file age), so a fresh report reloads over the network while an old one
    # comes from cache: same URL, wildly different load time. Pin it instead.
    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    # Public links live under an unguessable uuid folder: no listing there.
    # They are handed to people and to automated readers, so unlike the
    # private tree they may be indexed and archived.
    location /public/ {
        autoindex off;
        add_header X-Robots-Tag "index, follow" always;
        add_header Access-Control-Allow-Origin "*" always;
        # UUID folder: the link points at one immutable file.
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Never let nginx list dotfiles or backups.
    location ~ /\. { deny all; }
}
