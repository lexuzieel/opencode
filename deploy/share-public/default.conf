# The published side of the file dump, on its own name.
#
# Every path here is a link someone was given on purpose, and an
# automated reader may be the one opening it: no login, no listing, and
# nothing that tells a crawler to stay away. The private tree keeps its
# own host, its authelia login and its blocking robots.txt; the two are
# separate on purpose, because a robots.txt that mixes "disallow
# everything" with "allow this folder" is read differently by different
# clients, and the strict reading blocks the very links we hand out.
server {
    listen 80;
    server_name _;
    # The whole dump is mounted read-only so the published tree can keep
    # its symlinks into it; only the public folder is reachable.
    root /usr/share/nginx/html/public;
    disable_symlinks off;
    charset utf-8;

    # Nothing here needs to be secret, and a reviewer may be a crawler.
    add_header X-Robots-Tag "index, follow" always;
    add_header Access-Control-Allow-Origin "*" always;

    # No directory listing: the uuid in the path is the only way in.
    autoindex off;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location / {
        try_files $uri =404;
    }

    location ~ /\. { deny all; }
}
