# Terminal settings for the agent tmux servers (agent.sh, sockets
# "claude" and "codex"). Passed with -f, so tmux reads it when a
# server starts: the first session after a reboot gets them too.

# Panes advertise a modern terminal, and the outer terminal's 24-bit
# colour (RGB) is passed through.
set -g default-terminal "tmux-256color"
set -sa terminal-features ",*:RGB"

# Apps in the panes pick their colour depth from these, whatever the
# login shell reads on start.
set-environment -g COLORTERM truecolor
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Pass OSC queries/responses (theme dark/light detection, OSC 11) between
# apps in the panes and the outer terminal, so "system" theme mode sees
# the real profile instead of falling back to light.
set -g allow-passthrough on
